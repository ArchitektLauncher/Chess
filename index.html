<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Tournament</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--panel:#141416;--line:#26262a;--gold:#c9a24a;--gold2:#e6c57a;--text:#ece8df;--mute:#8d8a82;--red:#d9604c}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.4 Inter,Arial,sans-serif;display:flex;min-height:100vh}
h1,h2,.brand{font-family:"Playfair Display",Georgia,serif;font-weight:600}
aside{width:272px;flex:none;background:#101012;border-right:1px solid var(--line);padding:36px 24px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{text-align:center;font-size:84px;color:var(--gold2);line-height:1}
.brand{text-align:center;font-size:30px;line-height:1.15;margin:10px 0 32px}
nav a{display:block;padding:12px 16px;border-radius:10px;color:var(--mute);text-decoration:none;margin-bottom:6px}
nav a.on,nav a:hover{background:#4a3c1c;color:var(--text)}
.tag{margin-top:auto;text-align:center;font:italic 15px Georgia,serif;color:var(--mute)}
main{flex:1;padding:36px 40px;max-width:1280px;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font-size:38px}
h1 span{color:var(--gold);margin-right:14px}
.btn{background:none;border:1px solid var(--gold);color:var(--gold2);padding:11px 20px;border-radius:10px;font:600 14px Inter,sans-serif;cursor:pointer;margin-left:8px}
.btn:hover,.btn.fill{background:var(--gold);color:#17130a}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:24px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);font-weight:500;padding:18px 10px;text-align:center}
td,th{white-space:nowrap}
td{padding:14px 10px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.lead td{background:#2a2312;border-top:1px solid var(--gold)}
tr.lead td:first-child{box-shadow:inset 3px 0 var(--gold)}
.pl{display:flex;align-items:center;gap:14px;font-weight:500}
.av{width:38px;height:38px;border-radius:50%;background:#222226;display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.lead .av{border-color:var(--gold)}
td.pts{font-weight:700;font-size:17px}
.sec{padding:22px 24px}
h2{font-size:22px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px}
.card{background:#101012;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.big{font:700 46px "Playfair Display",serif;margin:8px 0 2px}
.bars{display:flex;align-items:flex-end;gap:18px;height:110px;margin-top:10px;border-bottom:1px solid var(--line)}
.bar{flex:1;text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--gold);border-radius:3px 3px 0 0;margin-bottom:0}
.lab{display:flex;gap:18px;margin-top:6px}
.lab span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.m{display:grid;grid-template-columns:1fr 90px 1fr 170px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.m b{text-align:center;font-size:17px}
.m small{background:#222226;border-radius:6px;padding:2px 8px;margin-left:8px;color:var(--mute)}
.m time{text-align:right;color:var(--mute);font-size:13px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:14px;padding:26px;width:400px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:14px 0 6px;color:var(--mute);font-size:13px}
dialog input,dialog select{width:100%;padding:10px;background:#0c0c0e;color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}
.acts{display:flex;justify-content:flex-end;margin-top:22px}
.note{background:#2a2312;border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:var(--gold2)}
.ar{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.ar b{flex:1;font-weight:500}.ar input{width:90px;padding:8px;background:#0c0c0e;color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}.ar .btn{margin:0;padding:8px 14px}.ar time{color:var(--mute);font-size:13px}.empty{padding:28px;text-align:center;color:var(--mute)}
@media(max-width:900px){aside{display:none}main{padding:20px}.stats{grid-template-columns:1fr}.panel{overflow-x:auto}}
</style>
</head>
<body>
<aside>
  <div class="logo">♚</div>
  <div class="brand">Chess<br>Tournament</div>
  <nav>
    <a href="#top" class="on">Таблица</a>
    <a href="#stats">Статистика</a>
    <a href="#matches">Матчи</a>
    <a href="#admin" id="navA" hidden>Админка</a>
  </nav>
  <div class="tag">Игра. Стратегия. Победа.</div>
</aside>

<main id="top">
  <header>
    <h1><span>🏆</span>Турнирная таблица</h1>
    <div style="display:flex;align-items:center"><span id="who" style="color:var(--gold2)" hidden></span><button class="btn" id="bOut" hidden>Выйти</button><button class="btn" id="bLogin">Войти</button><button class="btn" id="bReg">Регистрация</button><button class="btn fill" id="addM" hidden>+ Добавить матч</button></div>
  </header>
  <div id="demo" class="note" hidden>Демо-режим: данные не сохраняются. Не найден config.js с URL и ключом Supabase. Создай его в репозитории рядом с index.html.</div>
  <div id="err" class="note" style="border-color:var(--red);color:var(--red)" hidden></div>

  <div class="panel"><table id="tbl"></table></div>

  <section class="panel sec" id="stats">
    <h2>Статистика</h2>
    <div class="stats">
      <div class="card" id="cnt"></div>
      <div class="card" id="best"></div>
      <div class="card"><div style="color:var(--mute)">Распределение очков</div><div class="bars" id="bars"></div><div class="lab" id="lab"></div></div>
    </div>
  </section>

  <section class="panel sec" id="matches">
    <h2>Последние матчи</h2>
    <div id="recent"></div>
  </section>
  <section class="panel sec" id="admin" hidden></section>
</main>

<dialog id="dm">
  <h2>Новый матч</h2>
  <label>Белые</label><select id="mw"></select>
  <label>Чёрные</label><select id="mb"></select>
  <label>Результат</label>
  <select id="mr"><option value="1-0">1-0 (победа белых)</option><option value="1/2">½-½ (ничья)</option><option value="0-1">0-1 (победа чёрных)</option></select>
  <div class="acts"><button class="btn" data-close>Отмена</button><button class="btn fill" id="saveM">Сохранить матч</button></div>
</dialog>

<dialog id="da">
  <h2 id="at">Вход</h2>
  <label>Ник (3–14 символов: буквы, цифры, _)</label><input id="an" maxlength="14" autocomplete="username">
  <label>Пароль (минимум 6 символов)</label><input id="ap" type="password" autocomplete="current-password">
  <div id="aw" hidden><label>Аватар (эмодзи)</label><input id="aa" value="♟" maxlength="4"></div>
  <div class="note" id="ae" style="margin:14px 0 0;border-color:var(--red);color:var(--red)" hidden></div>
  <div class="acts"><button class="btn" data-close>Отмена</button><button class="btn fill" id="aok">Войти</button></div>
</dialog>

<script src="config.js"></script>
<script>
// ===== CONFIG: вставь свои данные из Supabase (Project Settings → API) =====
const CFG = window.CHESS_CONFIG || { URL: "", KEY: "" };
// ===========================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEMO = !CFG.URL || !CFG.KEY || CFG.KEY.startsWith("ВСТАВЬ");
let players = [], matches = [], isAdmin = false, fresh = false;
let session = JSON.parse(localStorage.getItem("ct_s") || "null");
const save = s => { session = s; s ? localStorage.setItem("ct_s", JSON.stringify(s)) : localStorage.removeItem("ct_s"); };
const mail = n => [...new TextEncoder().encode(n.toLowerCase())].map(b => b.toString(16).padStart(2, "0")).join("") + "@chess-tournament.app";
const me = () => session && players.find(p => p.user_id === session.user.id);

async function auth(path, body) {
  const r = await fetch(CFG.URL + "/auth/v1/" + path, { method: "POST", headers: { apikey: CFG.KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) {
    const m = j.msg || j.error_description || j.message || "";
    throw new Error(/already/i.test(m) ? "Этот ник уже занят" : /invalid login/i.test(m) ? "Неверный ник или пароль" : /password/i.test(m) ? "Пароль минимум 6 символов" : m || "Ошибка");
  }
  return j;
}
const toSession = j => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() / 1000 + (j.expires_in || 3600), user: j.user });
async function token() {
  if (!session) return CFG.KEY;
  if (session.expires_at - 60 < Date.now() / 1000) {
    try { save(toSession(await auth("token?grant_type=refresh_token", { refresh_token: session.refresh_token }))); }
    catch { save(null); return CFG.KEY; }
  }
  return session.access_token;
}
async function api(path, opt = {}) {
  const r = await fetch(CFG.URL + "/rest/v1/" + path, { ...opt, headers: { apikey: CFG.KEY, ...(session ? { Authorization: "Bearer " + await token() } : {}), "Content-Type": "application/json", ...(opt.headers || {}) } });
  if (!r.ok) throw new Error(await r.text());
  return opt.method && opt.method !== "GET" ? null : r.json();
}

async function load() {
  try {
    if (DEMO) {
      $("demo").hidden = false;
      if (!players.length) {
        players = [[1,"ChessMaster",2450,"👑"],[2,"GrandMasterX",2420,"🥷"],[3,"FisherCat",2380,"🐱"],[4,"PixelChess",2350,"🟩"],[5,"AnonPlayer",2300,"❓"]].map(([id,name,elo,avatar]) => ({id,name,elo,avatar}));
        const g = [[1,2,"1-0"],[1,3,"1/2"],[1,4,"1-0"],[1,5,"1-0"],[2,3,"1-0"],[2,4,"1-0"],[2,5,"1/2"],[3,4,"1-0"],[3,5,"1-0"],[4,5,"1-0"]];
        matches = g.map(([w,b,result],i) => ({id:i,white_id:w,black_id:b,result,created_at:new Date(Date.now()-i*3.6e6).toISOString()}));
      }
    } else {
      [players, matches] = await Promise.all([api("players?select=*&order=id"), api("matches?select=*&order=created_at.desc")]);
      if (session && !me() && fresh) {
        fresh = false;
        const md = session.user.user_metadata || {};
        await api("players", { method: "POST", body: JSON.stringify({ name: md.nick, avatar: md.avatar || "♟" }), headers: { Prefer: "return=minimal" } });
        players = await api("players?select=*&order=id");
      }
      try { isAdmin = !!session && (await api("admins?select=user_id")).length > 0; } catch { isAdmin = false; }
    }
    $("err").hidden = true;
  } catch (e) {
    $("err").hidden = false;
    $("err").textContent = "Не удалось загрузить данные: " + e.message;
  }
  render(); head();
}

const PH = { Prefer: "return=minimal" };
function renderAdmin() {
  $("admin").hidden = !isAdmin; $("navA").hidden = !isAdmin;
  if (!isAdmin) return;
  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const fmt = t => new Date(t).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
  $("admin").innerHTML = "<h2>Админка</h2><div class='card' style='margin-bottom:16px'><div style='color:var(--mute);margin-bottom:6px'>Добавить участника</div><div class='ar'><input id='xn' placeholder='Ник' maxlength='14' style='width:170px'><input id='xe' type='number' value='1500'><input id='xa' value='♟' maxlength='4' style='width:60px'><button class='btn fill' data-addp='1'>Добавить</button></div></div><div class='card'><div style='color:var(--mute);margin-bottom:6px'>Игроки</div>" +
    players.map(p => `<div class="ar"><span class="av">${esc(p.avatar || "♟")}</span><input style="flex:1;width:auto;min-width:110px" value="${esc(p.name)}" maxlength="14" data-name="${p.id}"><input type="number" value="${p.elo}" data-elo="${p.id}"><button class="btn" data-save="${p.id}">Сохранить</button>${session && p.user_id === session.user.id ? "" : `<button class="btn" data-delp="${p.id}">Удалить</button>`}</div>`).join("") +
    "</div><div class='card' style='margin-top:16px'><div style='color:var(--mute);margin-bottom:6px'>Все матчи</div>" +
    (matches.length ? matches.map(m => `<div class="ar"><b>${esc((byId[m.white_id] || {}).name || "?")} — ${esc((byId[m.black_id] || {}).name || "?")}</b><span>${m.result === "1/2" ? "½-½" : m.result}</span><time>${fmt(m.created_at)}</time><button class="btn" data-delm="${m.id}">Удалить</button></div>`).join("") : "<div class='empty'>Матчей нет</div>") + "</div>";
}
$("admin").onclick = async e => {
  const d = e.target.dataset;
  try {
    if (d.save) {
      const q = k => $("admin").querySelector(`[data-${k}="${d.save}"]`).value;
      const name = q("name").trim();
      if (name.length < 3 || name.length > 14) return alert("Ник: от 3 до 14 символов");
      await api("players?id=eq." + d.save, { method: "PATCH", body: JSON.stringify({ name, elo: +q("elo") || 1500 }), headers: PH });
    }
    else if (d.addp) {
      const name = $("xn").value.trim();
      if (name.length < 3 || name.length > 14) return alert("Ник: от 3 до 14 символов");
      await api("players", { method: "POST", body: JSON.stringify({ name, elo: +$("xe").value || 1500, avatar: $("xa").value.trim() || "♟", user_id: null }), headers: PH });
    }
    else if (d.delp) { if (!confirm("Удалить игрока и все его матчи?")) return; await api("players?id=eq." + d.delp, { method: "DELETE", headers: PH }); }
    else if (d.delm) { if (!confirm("Удалить матч?")) return; await api("matches?id=eq." + d.delm, { method: "DELETE", headers: PH }); }
    else return;
    load();
  } catch (err) { alert("Ошибка: " + err.message); }
};

function head() {
  const p = me(), on = !!session;
  $("who").hidden = !on; $("bOut").hidden = !on; $("addM").hidden = !on;
  $("bLogin").hidden = on; $("bReg").hidden = on;
  $("who").textContent = on ? (p ? p.name : session.user.user_metadata?.nick || "") + (isAdmin ? " ★" : "") : "";
}

function calc() {
  const s = {};
  players.forEach(p => s[p.id] = { p, pts: 0, vs: {}, bh: 0 });
  matches.forEach(m => {
    const a = s[m.white_id], b = s[m.black_id];
    if (!a || !b) return;
    const [x, y] = m.result === "1-0" ? [1, 0] : m.result === "0-1" ? [0, 1] : [.5, .5];
    a.pts += x; b.pts += y;
    (a.vs[b.p.id] ||= []).push(x);
    (b.vs[a.p.id] ||= []).push(y);
  });
  const rows = Object.values(s);
  rows.forEach(r => r.bh = Object.keys(r.vs).reduce((t, id) => t + s[id].pts, 0));
  return rows.sort((a, b) => b.pts - a.pts || b.bh - a.bh || b.p.elo - a.p.elo);
}

const lab = x => x === 1 ? "1-0" : x === 0 ? "0-1" : "½-½";
function cell(r, o) {
  if (r === o) return "—";
  const v = r.vs[o.p.id];
  if (!v) return "·";
  return v.length === 1 ? lab(v[0]) : v.reduce((a, b) => a + b, 0) + "/" + v.length;
}

function render() {
  const rows = calc();
  if (!rows.length) { $("tbl").innerHTML = '<tr><td class="empty">Пока нет игроков. Нажми «+ Игрок».</td></tr>'; }
  else {
    $("tbl").innerHTML = "<tr><th>#</th><th>Игрок</th><th>Эло</th>" + rows.map((_, i) => `<th>${i + 1}</th>`).join("") + "<th>Очки</th><th>Бухгольц</th></tr>" +
      rows.map((r, i) => `<tr class="${i ? "" : "lead"}"><td>${i + 1}</td><td><div class="pl"><span class="av">${esc(r.p.avatar || "♟")}</span>${esc(r.p.name)}</div></td><td>${r.p.elo}</td>` +
        rows.map(o => `<td>${cell(r, o)}</td>`).join("") + `<td class="pts">${r.pts.toFixed(1)}</td><td>${r.bh.toFixed(1)}</td></tr>`).join("");
  }

  renderAdmin(rows);
  const draws = matches.filter(m => m.result === "1/2").length;
  $("cnt").innerHTML = `<div class="row"><span>Партий сыграно</span><b>${matches.length}</b></div><div class="row"><span>Решающих</span><b>${matches.length - draws}</b></div><div class="row"><span>Ничьих</span><b>${draws}</b></div>`;

  const top = [...players].sort((a, b) => b.elo - a.elo)[0];
  $("best").innerHTML = top ? `<div style="color:var(--mute)">Лучший рейтинг</div><div class="big">${top.elo} <span style="color:var(--gold2)">♛</span></div><div>${esc(top.name)}</div>` : '<div class="empty">Нет данных</div>';

  const mx = Math.max(1, ...rows.map(r => r.pts));
  $("bars").innerHTML = rows.map(r => `<div class="bar"><i style="height:${Math.max(6, r.pts / mx * 100)}%"></i></div>`).join("");
  $("lab").innerHTML = rows.map(r => `<span>${r.pts.toFixed(1)}</span>`).join("");

  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const recent = [...matches].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);
  $("recent").innerHTML = recent.length ? recent.map(m => {
    const w = byId[m.white_id], b = byId[m.black_id];
    if (!w || !b) return "";
    const d = new Date(m.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<div class="m"><div>${esc(w.name)}<small>${w.elo}</small></div><b>${m.result === "1/2" ? "½-½" : m.result}</b><div>${esc(b.name)}<small>${b.elo}</small></div><time>${d}</time></div>`;
  }).join("") : '<div class="empty">Матчей пока нет. Нажми «+ Добавить матч».</div>';
}

let mode = "login";
function openAuth(m) {
  if (DEMO) return alert("Сначала создай config.js с URL и ключом Supabase");
  mode = m;
  $("at").textContent = m === "login" ? "Вход" : "Регистрация";
  $("aok").textContent = m === "login" ? "Войти" : "Создать аккаунт";
  $("aw").hidden = m === "login"; $("ae").hidden = true;
  $("ap").autocomplete = m === "login" ? "current-password" : "new-password";
  $("da").showModal();
}
$("bLogin").onclick = () => openAuth("login");
$("bReg").onclick = () => openAuth("reg");
$("bOut").onclick = () => { save(null); head(); };

$("aok").onclick = async () => {
  const nick = $("an").value.trim(), pass = $("ap").value;
  const fail = t => { $("ae").textContent = t; $("ae").hidden = false; };
  if (!/^[\p{L}\p{N}_]{3,14}$/u.test(nick)) return fail("Ник: 3–14 символов, только буквы, цифры и _");
  if (pass.length < 6) return fail("Пароль минимум 6 символов");
  try {
    if (mode === "reg") {
      const j = await auth("signup", { email: mail(nick), password: pass, data: { nick, avatar: $("aa").value.trim() || "♟" } });
      if (!j.access_token) return fail("В Supabase включено подтверждение почты: выключи Confirm email");
      save(toSession(j)); fresh = true;
    } else save(toSession(await auth("token?grant_type=password", { email: mail(nick), password: pass })));
    $("ap").value = ""; $("da").close(); load();
  } catch (e) { fail(e.message); }
};

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

$("addM").onclick = () => {
  const p = me();
  if (!p) return alert("Тебя нет в списке участников. Обратись к админу.");
  if (isAdmin) $("mw").dataset.free = "1";
  if (players.length < 2) return alert("Нужен минимум ещё один игрок");
  const opts = players.map(x => `<option value="${x.id}">${esc(x.name)} (${x.elo})</option>`).join("");
  $("mw").innerHTML = opts; $("mb").innerHTML = opts;
  $("mw").value = p.id; $("mb").value = (players.find(x => x.id !== p.id) || {}).id;
  $("dm").showModal();
};
$("saveM").onclick = async () => {
  const w = +$("mw").value, b = +$("mb").value, result = $("mr").value, p = me();
  if (w === b) return alert("Выбери двух разных игроков");
